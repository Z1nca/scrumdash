<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" role="img" aria-label="You chat with Claude on the left; Scrumdash shows the project on the right" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="820" height="420" rx="18" fill="#17181a"/>

  <!-- chat side -->
  <rect x="24" y="24" width="372" height="372" rx="14" fill="#222326" stroke="#3c4043"/>
  <text x="44" y="56" fill="#e8eaed" font-size="16" font-weight="700">Your Claude chat</text>
  <text x="44" y="76" fill="#9aa0a6" font-size="12">you keep talking, like always</text>
  <rect x="150" y="96" width="226" height="40" rx="12" fill="#2f7cf6"/><text x="164" y="121" fill="#fff" font-size="13">Add a gift card page to the shop</text>
  <rect x="44" y="148" width="250" height="58" rx="12" fill="#2c2d31"/><text x="58" y="172" fill="#e8eaed" font-size="13">Building it now. Fixed amounts</text><text x="58" y="191" fill="#e8eaed" font-size="13">or any amount? I put it on a card.</text>
  <rect x="210" y="218" width="166" height="40" rx="12" fill="#2f7cf6"/><text x="224" y="243" fill="#fff" font-size="13">Add this idea: newsletter</text>
  <rect x="44" y="270" width="250" height="58" rx="12" fill="#2c2d31"/><text x="58" y="294" fill="#e8eaed" font-size="13">Saved under Ideas. The signup page</text><text x="58" y="313" fill="#e8eaed" font-size="13">from earlier is ready to try.</text>
  <text x="44" y="368" fill="#9aa0a6" font-size="12">compacting and new chats can happen by themselves</text>

  <!-- arrows -->
  <g stroke="#7c4dff" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M402 165 H 428"/><path d="M421 158 L 429 165 L 421 172"/>
    <path d="M428 300 H 402"/><path d="M409 293 L 401 300 L 409 307"/>
  </g>
  <text x="415" y="150" fill="#b9a6ff" font-size="11" text-anchor="middle">cards</text>
  <text x="415" y="290" fill="#b9a6ff" font-size="11" text-anchor="middle">clicks</text>

  <!-- board side -->
  <rect x="434" y="24" width="362" height="372" rx="14" fill="#222326" stroke="#3c4043"/>
  <text x="454" y="56" fill="#e8eaed" font-size="16" font-weight="700">Scrumdash, next to it</text>
  <text x="454" y="76" fill="#9aa0a6" font-size="12">the whole project at a glance</text>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="454" y="92" width="76" height="26" rx="8" fill="#7c4dff"/><text x="492" y="110" fill="#fff">Decide</text>
    <rect x="536" y="92" width="62" height="26" rx="8" fill="#2f7cf6"/><text x="567" y="110" fill="#fff">Test</text>
    <rect x="604" y="92" width="62" height="26" rx="8" fill="#d99a00"/><text x="635" y="110" fill="#fff">Ideas</text>
    <rect x="672" y="92" width="56" height="26" rx="8" fill="#3c4043"/><text x="700" y="110" fill="#fff">Guide</text>
    <rect x="734" y="92" width="44" height="26" rx="8" fill="#3c4043"/><text x="756" y="110" fill="#fff">Chat</text>
  </g>
  <rect x="454" y="130" width="324" height="84" rx="10" fill="#2a2440" stroke="#5b4a9e"/>
  <text x="468" y="152" fill="#e8eaed" font-size="13" font-weight="700">Which gift card amounts?</text>
  <rect x="468" y="164" width="190" height="36" rx="9" fill="#8b6cff"/><text x="563" y="187" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">★ Fixed amounts</text>
  <rect x="666" y="164" width="98" height="36" rx="9" fill="none" stroke="#5b4a9e"/><text x="715" y="187" fill="#c9b8ff" font-size="12" text-anchor="middle">Any amount</text>
  <rect x="454" y="224" width="324" height="64" rx="10" fill="#26272b" stroke="#3c4043"/>
  <text x="468" y="246" fill="#e8eaed" font-size="13" font-weight="700">Signup page: ready to try</text>
  <g font-size="11" fill="#e8eaed" text-anchor="middle"><rect x="468" y="256" width="96" height="24" rx="6" fill="none" stroke="#5f6368"/><text x="516" y="272">Works</text><rect x="572" y="256" width="96" height="24" rx="6" fill="none" stroke="#5f6368"/><text x="620" y="272">Partly</text><rect x="676" y="256" width="96" height="24" rx="6" fill="none" stroke="#5f6368"/><text x="724" y="272">Doesn't work</text></g>
  <rect x="454" y="300" width="324" height="78" rx="10" fill="#3c4043"/>
  <circle cx="470" cy="320" r="5" fill="#45a466"/><text x="482" y="324" fill="#fff" font-size="13"><tspan font-weight="700">Claude</tspan> · Building the gift card page</text>
  <g font-size="11" fill="#fff" text-anchor="middle" font-weight="600">
    <rect x="464" y="338" width="74" height="26" rx="4" fill="#45a466"/><text x="501" y="355">Reading</text>
    <rect x="542" y="338" width="74" height="26" rx="4" fill="#d4b200"/><text x="579" y="355">Building</text>
    <rect x="620" y="338" width="74" height="26" rx="4" fill="#2c2d31"/><text x="657" y="355">Checking</text>
    <rect x="698" y="338" width="72" height="26" rx="4" fill="#2c2d31"/><text x="734" y="355">Your test</text>
  </g>
</svg>
